name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow the docker-publish + release workflows to gate on this CI run.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy vgi_anomaly/ anomaly_worker.py

      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_anomaly/ anomaly_worker.py

  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install the worker (with the http extra)
        run: uv sync --frozen --python 3.13 --extra http

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Lint via the project venv's interpreter (populated above by
          # `uv sync --frozen`), NOT `uv run`: `uv run` on the PEP 723 script
          # re-resolves its inline deps into a separate cached environment that
          # can pin a stale vgi-python and emit the old catalog schema, tripping a
          # false schema-mismatch. The venv is the exact frozen-locked SDK.
          location: ".venv/bin/python anomaly_worker.py"
          fail-on: info

  # The SQL suite (test/sql/*.test) through the published haybarn-unittest and the
  # signed community `vgi` extension, over every transport (ci/run-integration.sh,
  # adapted from the vgi-starter template): stdio (DuckDB spawns the worker per
  # connection), launch (DuckDB starts it once on an AF_UNIX socket and pools
  # connections) and http (the worker serves --http).
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    env:
      UV_PYTHON: "3.13"
      HAYBARN_VERSION: "2.0.1rc3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build the worker
        run: uv sync --locked --all-extras

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          WORKER="$PWD/.venv/bin/vgi-anomaly-worker" \
          HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest" \
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh
